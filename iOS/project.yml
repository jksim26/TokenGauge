# Generates TokenGauge.xcodeproj: run `xcodegen` in this folder (brew install xcodegen).
name: TokenGauge
options:
  deploymentTarget: { iOS: "17.0" }
  createIntermediateGroups: true
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: NO
targets:
  TokenGauge:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: ../Sources/Shared.swift
        group: Mac
      - path: ../Sources/ProviderMark.swift
        group: Mac
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Token Gauge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [$(BUNDLE_PREFIX).TokenGauge.refresh]
        ITSAppUsesNonExemptEncryption: false
        TokenGaugeAppGroup: group.$(BUNDLE_PREFIX).TokenGauge
    entitlements:
      path: App/TokenGauge.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUNDLE_PREFIX).TokenGauge]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).TokenGauge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: TokenGaugeWidget
  TokenGaugeWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
      - path: ../Sources/Shared.swift
        group: Mac
      - path: ../Sources/ProviderMark.swift
        group: Mac
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Token Gauge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        TokenGaugeAppGroup: group.$(BUNDLE_PREFIX).TokenGauge
    entitlements:
      path: Widget/TokenGaugeWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUNDLE_PREFIX).TokenGauge]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).TokenGauge.Widget
